<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="barra">
  <div class="barra-marca"><span class="punto-marca"></span><span id="nombre-marca">Presupuestos 3D</span></div>
  <nav class="pestanas" role="tablist">
    <button class="pestana activa" role="tab" aria-selected="true" data-vista="nuevo">Nuevo</button>
    <button class="pestana" role="tab" aria-selected="false" data-vista="historial">Historial</button>
  </nav>
</header>

<div id="pendientes" class="banner aviso global" hidden></div>

<main>
  <section id="vista-nuevo" class="vista">
    <label id="soltar" class="soltar">
      <input id="entrada" type="file" accept=".3mf" hidden>
      <svg class="soltar-icono" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 40 15v18L24 42 8 33V15z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 15l16 9 16-9M24 24v18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span class="soltar-titulo">Arrastra aquí tu <b>.3mf</b></span>
      <span class="soltar-texto">o haz clic para elegirlo · Bambu Studio, laminado o no · hasta 100 MB</span>
    </label>

    <div id="error" class="banner error" role="alert" hidden></div>

    <div id="esqueleto" class="rejilla" hidden>
      <div class="columna">
        <div class="tarjeta esq-tarjeta"><div class="esq esq-img"></div><div class="esq-lineas"><div class="esq esq-l1"></div><div class="esq esq-l2"></div><div class="esq esq-l3"></div></div></div>
        <div class="tarjeta"><div class="esq esq-l2"></div><div class="esq esq-campo"></div><div class="esq esq-campo"></div><div class="esq esq-campo"></div></div>
      </div>
      <div class="columna"><div class="tarjeta"><div class="esq esq-l3"></div><div class="esq esq-precio"></div><div class="esq esq-l1"></div></div></div>
    </div>

    <div id="resultado" class="rejilla" hidden>
      <div class="columna">
        <article class="tarjeta pieza entra" style="--i:0">
          <div class="pieza-imagen"><img id="pieza-img" alt=""></div>
          <div class="pieza-info">
            <h1 id="pieza-titulo"></h1>
            <p id="pieza-detalle" class="tenue"></p>
            <div id="pieza-chips" class="chips"></div>
            <button id="cambiar" type="button" class="boton-texto">Cambiar fichero</button>
          </div>
        </article>


        <form id="formulario" class="tarjeta entra" style="--i:2" autocomplete="off" novalidate>
          <div class="campos principales">
            <label class="campo">Cliente<input name="cliente" placeholder="Nombre del cliente"></label>
            <label class="campo">Preparación<span class="con-unidad"><input name="minutos" inputmode="decimal"><i>min</i></span></label>
            <label class="campo">Margen<span class="con-unidad"><input name="margen" inputmode="decimal"><i>%</i></span></label>
          </div>
          <fieldset id="manual" class="manual" hidden>
            <legend>Tiempo de impresión <small>(de la vista previa de Bambu Studio)</small></legend>
            <div class="campos">
              <label class="campo"><span class="con-unidad"><input name="horas" inputmode="numeric" placeholder="0"><i>h</i></span></label>
              <label class="campo"><span class="con-unidad"><input name="mins" inputmode="numeric" placeholder="0"><i>min</i></span></label>
            </div>
          </fieldset>
          <h3>Filamentos</h3>
          <div id="filamentos" class="filamentos"></div>
        </form>

        <section class="tarjeta tiempo relleno entra" data-minimo="132" style="--i:3">
          <div class="tiempo-cabecera">
            <div>
              <span class="etiqueta">Tiempo</span>
              <div id="tiempo-leyenda" class="leyenda"></div>
            </div>
            <span id="tiempo-fin" class="tiempo-fin"></span>
          </div>
          <div class="tiempo-grafico">
            <div id="tiempo-barra" class="tiempo-barra" role="img"></div>
            <div id="tiempo-marcas" class="tiempo-marcas"></div>
          </div>
        </section>
      </div>

      <aside class="columna lateral">
        <div class="centro">
          <section class="tarjeta precio entra" style="--i:3" aria-live="polite">
            <div class="etiqueta">Total</div>
            <div id="total" class="total">—</div>
            <p id="resumen" class="resumen"></p>
            <p id="precio-mensaje" class="precio-mensaje" hidden></p>
            <dl id="desglose" class="desglose"></dl>
          </section>
          <section class="tarjeta complejidad entra" style="--i:4">
            <div class="complejidad-cabecera">
              <div class="etiqueta">Complejidad</div>
              <label class="casilla"><input id="aplicar-complejidad" type="checkbox" checked><span class="interruptor"></span>Aplicar</label>
            </div>
            <div class="complejidad-valor"><span id="complejidad-nivel">—</span><span id="complejidad-pct" class="pct"></span></div>
            <div class="medidor"><span id="medidor-marca" class="medidor-marca"></span></div>
            <div class="medidor-extremos"><span>Sencilla</span><span>Compleja</span></div>
            <ul id="motivos" class="motivos"></ul>
          </section>
          <section class="tarjeta reparto relleno entra" data-minimo="150" style="--i:5">
            <div class="etiqueta">Reparto del precio</div>
            <div id="reparto" class="reparto-grafico" role="img" aria-label="Reparto del precio">
              <div class="reparto-barra"></div>
              <div class="reparto-etiquetas"></div>
            </div>
          </section>
        </div>
        <section class="tarjeta previa entra" style="--i:6">
          <div class="previa-cabecera">
            <h2>Vista previa</h2>
            <label class="casilla"><input id="desglose-pdf" type="checkbox" checked><span class="interruptor"></span>Desglose</label>
          </div>
          <div id="marco" class="marco"><iframe id="previa" title="Vista previa del presupuesto" tabindex="-1"></iframe></div>
          <button id="exportar" type="button" class="boton ancho" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Exportar PDF
          </button>
        </section>
      </aside>
    </div>
  </section>

  <section id="vista-historial" class="vista" hidden>
    <div class="tarjeta historial">
      <h2>Historial</h2>
      <div class="tabla-contenedor">
        <table>
          <thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th>Modelo</th><th class="num">Tiempo</th><th class="num">Gramos</th><th class="num">Precio</th><th>Pagado</th></tr></thead>
          <tbody id="historial"></tbody>
        </table>
      </div>
      <p id="historial-vacio" class="tenue" hidden>Todavía no has exportado ningún presupuesto.</p>
    </div>
  </section>
</main>

<div id="tostada" class="tostada" role="status" hidden></div>
</body>
</html>

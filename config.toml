# Precio €/kg por defecto según el tipo de filamento (bobina suelta en la tienda de Bambu Lab).
# Se cambian desde la pestaña «Ajustes» de la app, que los guarda en la base de datos y tienen prioridad.
# También admite líneas por perfil ("Bambu PLA Matte" = 24.99), que ganan sobre el tipo.
[filamentos_eur_kg]
PLA = 17.5
PETG = 18.5
